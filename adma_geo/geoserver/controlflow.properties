# GeoServer control flow, mounted over the copy in the data directory (see docker-compose.yml).
# Reference: https://docs.geoserver.org/2.25.x/en/user/extensions/controlflow/index.html
#
# One map page asks GeoServer for dozens of tiles at once, more on a wide screen or while
# zooming. The image's default, user.ows.wms.getmap=30/s, refused the rest with 429 and
# left those tiles blank or stretched. Requests over a limit now wait instead of failing.

# Seconds a waiting request may queue before it fails.
timeout=60

# Requests GeoServer works on at once: in total, GetMap, Excel output, tile cache.
ows.global=100
ows.wms.getmap=16
ows.wfs.getfeature.application/msexcel=4
ows.gwc=16

# Requests one browser may have running at once; the rest queue.
user=16

# GetMap requests per second for one browser; above that they wait up to 2 s.
user.ows.wms.getmap=200/s;2s
user.ows.wps.execute=1000/d;30s
